# Builds a standalone Windows executable with Python bundled inside it, so
# there is nothing to install on the target machine.
name: Build Windows app

on:
  push:
    branches: [claude/financial-manager-revolut-07q4wi]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build executable
        run: >
          pyinstaller --onefile --name FinancialManager desktop.py
          --add-data "frontend;frontend"
          --add-data ".env.example;."
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all pydantic
          --collect-all pydantic_core
          --collect-all anthropic
          --collect-all email_validator
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.loops.asyncio
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          --hidden-import backend.app.main
          --exclude-module tkinter
          --exclude-module pytest
          --noconfirm

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $exe = "dist\FinancialManager.exe"
          if (-Not (Test-Path $exe)) { throw "Executable was not produced" }

          # Run it in a scratch folder so it creates its own .env and database,
          # exactly as it will on a user's machine.
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item $exe smoke\
          $env:PORT = "8123"
          $proc = Start-Process -FilePath "smoke\FinancialManager.exe" -PassThru -WorkingDirectory "smoke"

          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8123/api/health" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "health: $($r.Content)"; $ok = $true; break }
            } catch { }
          }

          if ($ok) {
            $home_page = Invoke-WebRequest "http://127.0.0.1:8123/" -UseBasicParsing -TimeoutSec 10
            Write-Host "home page status: $($home_page.StatusCode)"
            if ($home_page.Content -notmatch "Financial Manager") { throw "Frontend was not bundled" }
            if (-Not (Test-Path "smoke\.env")) { throw ".env was not created next to the exe" }
            Write-Host "Smoke test passed."
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-Not $ok) { throw "The executable did not start serving" }

      - uses: actions/upload-artifact@v4
        with:
          name: FinancialManager-windows
          path: dist/FinancialManager.exe
          retention-days: 90

      # Artifacts require a GitHub login to download. A release does not, so
      # the download link can be handed to someone directly.
      - name: Publish as a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows app - no installation needed.

          1. Download **FinancialManager.exe** below.
          2. Double-click it.
          3. Your browser opens on the app.

          Python is bundled inside; there is nothing to install. Windows
          SmartScreen may warn that the publisher is unknown, because the file
          is not code-signed - choose **More info** then **Run anyway**.

          Keep the black window open while you use the app. Your data is stored
          in a ``data`` folder created next to the .exe, so put it somewhere
          sensible before first run.

          Built from ``$env:GITHUB_SHA``.
          "@
          gh release delete windows-build --yes --cleanup-tag 2>&1 | Out-Null
          gh release create windows-build dist/FinancialManager.exe `
            --title "Financial Manager for Windows" `
            --notes "$notes" `
            --target $env:GITHUB_SHA
