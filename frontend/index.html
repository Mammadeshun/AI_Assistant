<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Financial Manager</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💷</text></svg>" />
</head>
<body>
  <!-- Auth gate ------------------------------------------------------- -->
  <div id="auth-screen" class="auth-screen hidden">
    <form id="auth-form" class="auth-card">
      <h1 class="auth-title">Financial Manager</h1>
      <p class="auth-sub" id="auth-sub">Sign in to your instance.</p>

      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required minlength="10" />
      </label>

      <div id="register-only" class="hidden">
        <label class="field hidden" id="signup-token-field">
          <span>Sign-up code</span>
          <input type="text" name="signup_token" autocomplete="off"
                 placeholder="From your host's environment settings" />
        </label>
        <label class="field">
          <span>Display name</span>
          <input type="text" name="display_name" autocomplete="name" />
        </label>
        <label class="field">
          <span>Base currency</span>
          <select name="base_currency">
            <option>GBP</option><option>EUR</option><option>USD</option>
            <option>PLN</option><option>RON</option><option>CHF</option><option>SEK</option>
          </select>
        </label>
      </div>

      <p class="auth-error hidden" id="auth-error"></p>
      <button class="btn btn-primary btn-block" type="submit" id="auth-submit">Sign in</button>
    </form>
  </div>

  <!-- App ------------------------------------------------------------- -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">💷 <span>Finances</span></div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></button>
        <button class="nav-item" data-view="assistant"><span class="nav-icon">✨</span><span class="nav-label">Assistant</span></button>
        <button class="nav-item" data-view="transactions"><span class="nav-icon">🧾</span><span class="nav-label">Transactions</span></button>
        <button class="nav-item" data-view="budgets"><span class="nav-icon">🎯</span><span class="nav-label">Budgets</span></button>
        <button class="nav-item" data-view="recurring"><span class="nav-icon">🔁</span><span class="nav-label">Recurring</span></button>
        <button class="nav-item" data-view="accounts"><span class="nav-icon">🏦</span><span class="nav-label">Accounts</span></button>
        <button class="nav-item" data-view="rules"><span class="nav-icon">⚙️</span><span class="nav-label">Rules</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block hidden" id="install-btn">Install app</button>
        <button class="btn btn-ghost btn-block" id="sync-btn">Sync now</button>
        <div class="sync-status" id="sync-status"></div>
        <button class="btn btn-link" id="logout-btn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="view-title">Dashboard</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <div id="view" class="view"></div>
    </main>

    <!-- Phone navigation: thumb-reachable, and the only nav on small screens -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="dashboard"><span class="nav-icon">📊</span><span class="nav-label">Home</span></button>
      <button class="tab" data-view="transactions"><span class="nav-icon">🧾</span><span class="nav-label">Activity</span></button>
      <button class="tab" data-view="assistant"><span class="nav-icon">✨</span><span class="nav-label">Ask</span></button>
      <button class="tab" data-view="budgets"><span class="nav-icon">🎯</span><span class="nav-label">Budgets</span></button>
      <button class="tab" id="more-btn"><span class="nav-icon">☰</span><span class="nav-label">More</span></button>
    </nav>
  </div>

  <!-- Modal ----------------------------------------------------------- -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="btn btn-icon" id="modal-close" aria-label="Close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
